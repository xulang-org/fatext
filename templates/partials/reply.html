<li id="$msg_id" class="$reply_class">
  <div class="meta">
    <a class="who" href="$author_href">$author_name</a>
    <span class="id">$sender_id</span>
    <time datetime="$iso_time">$human_time</time>$reply_to_html$state_badge
    <a class="anchor" href="#$msg_id" title="Permalink">#</a>
  </div>
  <div class="text">$text</div>
  <div class="acts">
    <details class="sig">
      <summary>[✓ RSA]</summary>
      <dl class="sig-dl">
        <dt>msg_id</dt><dd class="wrap-any">$msg_id</dd>
        <dt>sender_id</dt><dd>$sender_id (key v$key_version)</dd>
        <dt>signed_at</dt><dd>$ts ($iso_time)</dd>
        <dt>target</dt><dd class="wrap-any">POST /v1/threads/$thread_id/replies</dd>
        <dt>sig</dt><dd class="wrap-any">$sig_full</dd>
      </dl>
    </details>
  </div>
</li>
