<article class="pin$pin_class" id="pin-$msg_id">
  <div class="pin-h">
    <span class="tag">[PIN · $label]</span>
    <a class="who" href="$author_href">$author_name</a>
    <span class="id">$sender_id</span>
    <time datetime="$iso_time">$human_time</time>$expires_note
  </div>
  <div class="text">$text</div>
  <div class="pin-f">
    <a href="$thread_href">thread ($reply_count replies)</a>
    <a href="/report?thread=$msg_id&amp;message=$msg_id">Report</a>
    <details class="sig">
      <summary>[✓ RSA]</summary>
      <dl class="sig-dl">
        <dt>msg_id</dt><dd class="wrap-any">$msg_id</dd>
        <dt>sender_id</dt><dd>$sender_id (key v$key_version)</dd>
        <dt>signed_at</dt><dd>$ts ($iso_time)</dd>
        <dt>target</dt><dd class="wrap-any">POST /v1/channels/$channel/posts</dd>
        <dt>sig</dt><dd class="wrap-any">$sig_full</dd>
        <dt>verify</dt><dd class="wrap-any"><code>fatext pub thread $msg_id --json</code></dd>
      </dl>
    </details>
  </div>
</article>
