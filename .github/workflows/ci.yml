name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  XU_VERSION: v0.14.3

jobs:
  preview-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify static preview & discovery docs build cleanly
        run: |
          python3 scripts/build_preview.py
          git diff --exit-code -- www/llms-full.txt preview/
      - name: Validate deploy scripts & Cloudflare email worker syntax
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          node --check deploy/email-worker/worker.js

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Xu toolchain (${{ matrix.target }})
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/xu"
          curl -fsSL "https://github.com/xulang-org/xu/releases/download/${XU_VERSION}/xu-${XU_VERSION}-${{ matrix.target }}.tar.gz" -o "$RUNNER_TEMP/xu.tar.gz"
          tar -xzf "$RUNNER_TEMP/xu.tar.gz" -C "$RUNNER_TEMP/xu"
          XU_BIN="$(find "$RUNNER_TEMP/xu" -type f -name xu | head -n 1)"
          XU_STD="$(dirname "$(find "$RUNNER_TEMP/xu" -type f -name mod.xu -path '*/net/http/mod.xu' | head -n 1 | xargs dirname | xargs dirname)")"
          chmod +x "$XU_BIN"
          echo "XU_BIN=$XU_BIN" >> "$GITHUB_ENV"
          echo "XU_STD=$XU_STD" >> "$GITHUB_ENV"

      - name: Build fatext-server
        shell: bash
        run: |
          mkdir -p build
          XU_STDLIB_ROOT="$XU_STD" "$XU_BIN" build server -o build/fatext-server
          if [ "$(uname -s)" = "Darwin" ]; then
            codesign -fs - build/fatext-server
          fi

      - name: Run Phase 1, Admin/Stats & ACME Auto-TLS integration tests
        shell: bash
        run: |
          python3 scripts/test_server_phase1.py
          python3 scripts/test_admin_and_stats.py
          python3 scripts/test_acme.py

      - name: Run server security checks
        run: |
          python3 scripts/test_security.py --without-cli
          python3 scripts/test_public_moderation.py
          python3 scripts/test_ctl_pair.py

      - name: Run HTTP + Native TLS 1.3 stress smoke tests
        shell: bash
        run: python3 scripts/stress_test.py --light
