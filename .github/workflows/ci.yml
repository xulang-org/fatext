name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  XU_VERSION: v0.14.0

jobs:
  preview-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify static preview & discovery docs build cleanly
        run: python3 scripts/build_preview.py

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
            asset: xu-v0.14.0-linux-x64.tar.gz
          - target: linux-arm64
            os: ubuntu-24.04-arm
            asset: xu-v0.14.0-linux-arm64.tar.gz
          - target: macos-arm64
            os: macos-14
            asset: xu-v0.14.0-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Xu toolchain (${{ matrix.target }})
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/xu"
          curl -fsSL "https://github.com/xulang-org/xu/releases/download/${XU_VERSION}/${{ matrix.asset }}" -o "$RUNNER_TEMP/xu.tar.gz"
          tar -xzf "$RUNNER_TEMP/xu.tar.gz" -C "$RUNNER_TEMP/xu"
          XU_BIN="$(find "$RUNNER_TEMP/xu" -type f -name xu | head -n 1)"
          XU_STD="$(dirname "$(find "$RUNNER_TEMP/xu" -type f -name mod.xu -path '*/net/http/mod.xu' | head -n 1 | xargs dirname | xargs dirname)")"
          chmod +x "$XU_BIN"
          echo "XU_BIN=$XU_BIN" >> "$GITHUB_ENV"
          echo "XU_STD=$XU_STD" >> "$GITHUB_ENV"

      - name: Build fatext-server
        shell: bash
        run: |
          mkdir -p build
          XU_STDLIB_ROOT="$XU_STD" "$XU_BIN" build server -o build/fatext-server
          if [ "$(uname -s)" = "Darwin" ]; then
            codesign -fs - build/fatext-server
          fi

      - name: Run Phase 1 integration tests
        shell: bash
        run: python3 scripts/test_server_phase1.py
